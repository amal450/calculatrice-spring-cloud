
server:
  port: 8888

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          loadbalancer:
            cache:
              ttl: 5s
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

springdoc:
  swagger-ui:
    urls:
      - name: calcul-service
        url: /calcul-service/v3/api-docs
      - name: historique-service
        url: /historique-service/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      access: unrestricted
